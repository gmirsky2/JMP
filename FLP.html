<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dont look here, look at the URL</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      background: #181A20;
      color: #E6E6E6;
      font-family: 'JetBrains Mono', 'Fira Mono', 'Consolas', 'Menlo', 'monospace';
      margin: 0;
      padding: 0;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden !important;
      transition: background 0.3s, color 0.3s;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      min-height: 100vh;
      box-sizing: border-box;
  padding: 2.5vh 2vw;
    }
  #debug {
      background: #23242B;
  color: #E6E6E6;
      border-radius: 10px;
      box-shadow: 0 2px 16px #0008;
      padding: 1.4em 1.6em;
      margin: 2em 0 1.5em 0;
      font-size: 1.25em;
  width: 100%;
  max-width: none;
      letter-spacing: 0.03em;
      border: 1px solid #23242B;
      transition: background 0.3s, color 0.3s;
      box-sizing: border-box;
    }

    button, .button {
      background: linear-gradient(90deg, #2D2F3A 60%, #23242B 100%);
      color: #E6E6E6;
      border: none;
      border-radius: 6px;
      padding: 0.5em 1.2em;
      font-size: 1em;
      font-family: inherit;
      cursor: pointer;
      margin: 0 0.5em 0 0;
      box-shadow: 0 1px 4px #0004;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    button:hover, .button:hover {
      background: linear-gradient(90deg, #3A3C4A 60%, #23242B 100%);
      color: #FFD580;
      box-shadow: 0 2px 8px #0006;
    }
    ::selection {
      background: #FFD58033;
    }
    a {
      color: #FFD580;
      text-decoration: underline;
    }
    #show-help-btn {
      display: inline-block;
      position: relative;
  font-size: 4px;
  padding: 0.06em 0.12em;
      border-radius: 4px;
      box-shadow: none;
      line-height: 1;
      min-width: 0;
      width: auto;
      height: auto;
  margin-top: 0.7em;
      margin-bottom: 0.25em;
      vertical-align: middle;
      transform: scale(1);
      transform-origin: center center;
      transition: transform 180ms cubic-bezier(.2,.9,.2,1), box-shadow 180ms ease;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
    }
    #show-help-btn::before {
      content: '';
      position: absolute;
      left: -0.5em;
      right: -0.5em;
    top: -0.7em;
  height: 1.2em;
      background: transparent;
      pointer-events: auto;
      z-index: 1;
    }

    #show-help-btn:hover, #show-help-btn:focus, #show-help-btn:focus-visible {
      transform: translateY(0.9em) scale(4); /* shift down while scaling to 4x */
      box-shadow: 0 8px 18px #0008;
      z-index: 9999; /* ensure it stays above nearby elements when scaled */
    }
    .score {
      color: #FFD580;
      font-weight: bold;
    }
    .gravity {
      color: #0bc3ff;
      font-weight: bold;
    }
    .unescaped {
      font-size: 1.35em;
      color: #DDEFF7;
      font-weight: 700;
      letter-spacing: 0.01em;
      display: block;
      margin-bottom: 0.6em;
      word-break: break-word;
      max-width: 100%;
    }
    @media (max-width: 600px) {
      #debug {
        font-size: 1em;
        min-width: 0;
        padding: 0.7em 0.5em;
      }
      /* url-container media rules removed */
    }
  </style>
</head>
<body>
<button id="show-help-btn" class="button">Fix Character Encoding Issues</button>
<pre id="debug" style="font-family: monospace; white-space: pre; display:none;">Debug output will appear here.</pre>
<!-- Instruction banner (appears once) -->
<div id="url-instruction" style="display:none; position:fixed; top:3vh; left:2vw; max-width:40vw; box-sizing:border-box; z-index:10001;" aria-hidden="true">Look at the URL above ↑</div>
<button id="show-url-hint" class="button" style="position:fixed; top:3vh; right:2vw; font-size:1.5em; font-weight:bold; padding:0.35em 1em; z-index:10001; letter-spacing:0.04em; max-width:40vw; box-sizing:border-box;">Confused?</button>
<script>
  // Removed duplicated utility and renderer modules - consolidated implementations below inside IIFE
  // ...existing code...
/* Flappy Dot single-file game (braille URL rendering) */

let helpVisible = false;

// --- Modular Config Object ---
const FlappyConfig = {
  WIDTH: 20,              // characters
  HEIGHT_PIXELS: 4,       // pixels (rows) - 0..3
  PLAYER_X: 2,            // player horizontal position (in character columns)
  BRAILLE_BASE: 0x2800,   // Braille blank base
  URL_PREFIX: '|',        // URL prefix to ensure the URL begins with a visible separator
  GRAVITY_TICKS: 0.25,    // gravity effect per tick
  PIPE_WIDTH: 1,          // in characters
  PIPE_SPACING: 10,       // more frequent pipes for fun
  PIPE_SPEED: 0.5,        // characters per tick
  PIPE_SPAWN_TICKS: null, // will be set below
  TICK_INTERVAL: 120      // ms per game tick
};
FlappyConfig.PIPE_SPAWN_TICKS = Math.max(1, Math.round(FlappyConfig.PIPE_SPACING / FlappyConfig.PIPE_SPEED));

(function(){
  'use strict';

  // --- Browser compatibility: whitespace replacement detection ---
  let whitespaceReplacementChar = null;
  (function detectBrowserUrlWhitespaceEscaping() {
    const BRAILLE_SPACE = String.fromCharCode(FlappyConfig.BRAILLE_BASE);
    window.history.replaceState(null, null, '#' + BRAILLE_SPACE + BRAILLE_SPACE);
    if (window.location.hash.indexOf(BRAILLE_SPACE) === -1) {
      // Browser is escaping whitespace characters on URL
      whitespaceReplacementChar = pickWhitespaceReplacementChar();
    }
  })();

  // URL-instruction banner (one-time by default; can be re-shown)
  function showUrlInstructionOnce(force) {
    try {
  const key = 'flappy_dot_url_instruction_shown_v1';
  if (!force && localStorage && localStorage.getItem && localStorage.getItem(key)) return;
      const el = document.getElementById('url-instruction');
      if (!el) return;
      // style via JS to avoid moving CSS block; but keep it minimal
      Object.assign(el.style, {
        position: 'fixed',
        top: '8px',
  left: '16px',
        transform: 'none',
        background: 'linear-gradient(90deg,#2D2F3A,#23242B)',
        color: '#FFD580',
        padding: '0.25em 0.6em',
        borderRadius: '6px',
    boxShadow: '0 4px 12px #0006',
        fontFamily: 'inherit',
  fontSize: '22px',
  fontWeight: 'bold',
  letterSpacing: '0.04em',
        zIndex: 10000,
        opacity: 0,
        transition: 'opacity 600ms ease, transform 600ms ease'
      });
      el.style.display = 'block';
      // animate: fade in, wait, fade out
      requestAnimationFrame(() => {
        el.style.opacity = '1';
        el.style.transform = 'none';
      });
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => {
          el.style.display = 'none';
          try { localStorage.setItem(key, '1'); } catch (e) {}
        }, 700);
  }, 3000);
    } catch (e) {
      // ignore
    }
  }

  showUrlInstructionOnce(false);

  window.showFlappyUrlHint = function() { showUrlInstructionOnce(true); };

  window.addEventListener('keydown', function(e) {
    if (e.code === 'KeyU') {
      e.preventDefault();
      window.showFlappyUrlHint();
    }
  });

  const showUrlBtn = document.getElementById('show-url-hint');
  if (showUrlBtn) showUrlBtn.addEventListener('click', function() { window.showFlappyUrlHint(); });

  function pickWhitespaceReplacementChar() {
    const candidates = [
      ['\u0ADF', 'strange symbols'],
      ['\u27CB', 'some weird slashes'],
      ['\u2591', 'some kind of "fog"']
    ];
    for (const [char, desc] of candidates) {
      const c = eval(`'${char}'`);
      window.history.replaceState(null, null, '#' + c + c);
      if (window.location.hash.indexOf(c) !== -1) {
        return c;
      }
    }
    return '░';
  }

  function brailleForColumn(col0Bits, col1Bits) {
    let mask = 0;
    if (col0Bits & 1) mask |= 1 << 0;
    if (col0Bits & 2) mask |= 1 << 1;
    if (col0Bits & 4) mask |= 1 << 2;
    if (col0Bits & 8) mask |= 1 << 6;
    if (col1Bits & 1) mask |= 1 << 3;
    if (col1Bits & 2) mask |= 1 << 4;
    if (col1Bits & 4) mask |= 1 << 5;
    if (col1Bits & 8) mask |= 1 << 7;
    return String.fromCharCode(FlappyConfig.BRAILLE_BASE + mask);
  }

  const BLANK = String.fromCharCode(FlappyConfig.BRAILLE_BASE);

  let playerY = 1;
  let playerYFloat = playerY;
  let gameStarted = false;
  let pipes = [];
  let ticks = 0;
  let score = 0;

  let gameOver = false;
  let intervalId = null;

  function createPixelMap() {
    const cols = FlappyConfig.WIDTH * 2;
    const map = new Array(cols);
    for (let i = 0; i < cols; i++) map[i] = [0,0,0,0];
    return map;
  }

  const sharedPixelMap = (function(){
    const cols = FlappyConfig.WIDTH * 2;
    const m = new Array(cols);
    for (let i = 0; i < cols; i++) m[i] = [0,0,0,0];
    return m;
  })();
  function createPixelMap() {
    // reset in-place
    for (let i=0;i<sharedPixelMap.length;i++) sharedPixelMap[i][0]=sharedPixelMap[i][1]=sharedPixelMap[i][2]=sharedPixelMap[i][3]=0;
    return sharedPixelMap;
  }

  function writeHash({frameStr, asciiFallback, suffix}){
    let hash;
    if (location.protocol === 'file:') {
      if (asciiFallback === undefined) asciiFallback = pixelMapToAsciiString(sharedPixelMap);
      hash = FlappyConfig.URL_PREFIX + asciiFallback + '|' + frameStr + suffix;
    } else {
      hash = FlappyConfig.URL_PREFIX + frameStr + suffix;
    }
    if (whitespaceReplacementChar) hash = hash.replace(/\u2800/g, whitespaceReplacementChar);
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, null, '#' + hash);
      if (decodeURIComponent(window.location.hash) !== '#' + hash) window.location.hash = hash;
    } else {
      window.location.hash = hash;
    }
  }

  function pixelMapToString(map) {
    let s = '';
    for (let cx = 0; cx < FlappyConfig.WIDTH; cx++) {
      const left = map[cx*2];
      const right = map[cx*2 + 1];
      const leftBits = (left[0]?1:0) | (left[1]?2:0) | (left[2]?4:0) | (left[3]?8:0);
      const rightBits = (right[0]?1:0) | (right[1]?2:0) | (right[2]?4:0) | (right[3]?8:0);
      s += brailleForColumn(leftBits, rightBits);
    }
    return s;
  }

  function pixelMapToAsciiString(map) {
    const rows = Array.from({length: FlappyConfig.HEIGHT_PIXELS}, () => new Array(FlappyConfig.WIDTH).fill('.'));
    for (let cx = 0; cx < FlappyConfig.WIDTH; cx++) {
      for (let sub = 0; sub < 2; sub++) {
        const col = cx*2 + sub;
        for (let r = 0; r < FlappyConfig.HEIGHT_PIXELS; r++) {
          if (map[col][r]) rows[r][cx] = '#';
        }
      }
    }
    return rows.map(r => r.join('')).join(' ');
  }

  function spawnPipe(initial=false) {
    const gapSize = Math.random() < 0.5 ? 2 : 3;
    const maxGapY = FlappyConfig.HEIGHT_PIXELS - gapSize;
    const gapY = Math.floor(Math.random() * (maxGapY + 1));
    const startX = initial ? Math.min(FlappyConfig.WIDTH, Math.max(FlappyConfig.PLAYER_X + 5, FlappyConfig.PLAYER_X + 5)) : FlappyConfig.WIDTH;
    pipes.push({x: startX, gapY, gapSize});
  }

  function step() {
    if (window.gamePaused) return;
    if (gameOver) return;
    if (!gameStarted) {
      const pmap = createPixelMap();
      const px = FlappyConfig.PLAYER_X;
      const colIndex = px*2;
      if (playerY >= 0 && playerY < FlappyConfig.HEIGHT_PIXELS) {
        pmap[colIndex][playerY] = 1;
      }
  const frameStr = pixelMapToString(pmap);
  const asciiFallback = pixelMapToAsciiString(pmap);
  writeHash({frameStr, asciiFallback, suffix: '|Press_UP|'});
      return;
    }
    ticks++;
    playerYFloat += FlappyConfig.GRAVITY_TICKS;
    playerY = Math.round(playerYFloat);
    for (const p of pipes) p.x -= FlappyConfig.PIPE_SPEED;
    while (pipes.length && pipes[0].x < -FlappyConfig.PIPE_WIDTH - 1) pipes.shift();
    if (ticks % FlappyConfig.PIPE_SPAWN_TICKS === 0) spawnPipe();
    for (let i=0;i<pipes.length;i++){
      const p = pipes[i];
      const pipeRight = Math.floor(p.x) + FlappyConfig.PIPE_WIDTH - 1;
      if (!p.passed && pipeRight <= FlappyConfig.PLAYER_X - 1) {
        score++;
        p.passed = true;
      }
    }
    const pmap = createPixelMap();
    for (const p of pipes) {
      for (let cx = 0; cx < FlappyConfig.PIPE_WIDTH; cx++) {
        const charX = Math.floor(p.x) + cx;
        if (charX < 0 || charX >= FlappyConfig.WIDTH) continue;
        for (let r = 0; r < FlappyConfig.HEIGHT_PIXELS; r++) {
          if (r >= p.gapY && r < p.gapY + (p.gapSize || 2)) continue;
          pmap[charX*2][r] = 1;
          pmap[charX*2 + 1][r] = 1;
        }
      }
    }
    const px = FlappyConfig.PLAYER_X;
    const colIndex = px*2;
    if (playerY >= 0 && playerY < FlappyConfig.HEIGHT_PIXELS) {
      pmap[colIndex][playerY] = 1;
    }
    let hit = false;
    if (playerY >= 0 && playerY < FlappyConfig.HEIGHT_PIXELS) {
      if (isPixelPipeAt(colIndex, playerY, pipes)) hit = true;
    } else {
      hit = true;
    }
    if (playerY < 0 || playerY > FlappyConfig.HEIGHT_PIXELS-1) hit = true;
    if (hit) {
      gameOver = true;
      if (intervalId) cancelAnimationFrame(intervalId);
      if (debugIntervalId) { clearInterval(debugIntervalId); debugIntervalId = null; }
    }
      const frameStr = pixelMapToString(pmap);
      const asciiFallback = pixelMapToAsciiString(pmap);
      const msg = gameOver ? '|GAME_OVER|[Score:' + score + ']|F5=Retry|' : '[Score:' + score + ']';
      writeHash({frameStr, asciiFallback, suffix: msg});
  }

  function isPixelPipeAt(cx,ry,pipesList) {
    const charX = Math.floor(cx/2);
    for (const p of pipesList) {
      const px = Math.floor(p.x);
      if (px <= charX && charX < px + FlappyConfig.PIPE_WIDTH) {
        if (ry < p.gapY || ry >= p.gapY + 2) return true;
      }
    }
    return false;
  }

  window.addEventListener('keydown', function(e){
    if (e.code === 'ArrowUp') {
      e.preventDefault();
      if (!gameOver) {
        if (!gameStarted) {
          gameStarted = true;

          playerY = 1;
          playerYFloat = playerY;
          score = 0;
          ticks = 0;
        }

  playerYFloat -= 1;
        if (playerYFloat < 0) playerYFloat = 0;
      }
    }

  });

  window.addEventListener('blur', function() {
    window.gamePaused = true;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, null, window.location.hash + '[paused]');
    }
  });
  window.addEventListener('focus', function() {
    window.gamePaused = false;
    step();
  });

  spawnPipe(true);
  intervalId = requestAnimationFrame(rafLoop);

  playerYFloat = playerY;
  gameStarted = false;

  window.__flappy = {restart:function(){location.reload();},getState:()=>({playerY,score,pipes})};

  function decodeHashToGrid(hash) {
    if (!hash) return {raw:'',grid:[]};
    try {
      let decoded = decodeURIComponent(hash.replace(/^#/, ''));

  const pipeIndex = decoded.indexOf(FlappyConfig.URL_PREFIX);
  if (pipeIndex !== -1) decoded = decoded.slice(pipeIndex + FlappyConfig.URL_PREFIX.length);

  let main = decoded;

  main = main.replace(/\|[A-Z_]+\|$/, '');

  main = main.split('[Score:')[0];

      if (whitespaceReplacementChar) {
        main = main.replace(new RegExp(whitespaceReplacementChar, 'g'), String.fromCharCode(0x2800));
      }

      let rawCleaned = decoded;
      if (whitespaceReplacementChar) {
        rawCleaned = rawCleaned.replace(new RegExp(whitespaceReplacementChar, 'g'), String.fromCharCode(0x2800));
      }
      const chars = Array.from(main);

      const cols = chars.length;
      const rows = 4;

      const gridRows = Array.from({length:rows}, () => Array(cols*2).fill('.'));
      for (let c = 0; c < cols; c++) {
        const ch = chars[c];
        const code = ch.charCodeAt(0);
        if (code < 0x2800 || code > 0x28FF) continue;
        const mask = code - 0x2800;

        if (mask & (1<<0)) gridRows[0][c*2] = '#';
        if (mask & (1<<1)) gridRows[1][c*2] = '#';
        if (mask & (1<<2)) gridRows[2][c*2] = '#';
        if (mask & (1<<6)) gridRows[3][c*2] = '#';

        if (mask & (1<<3)) gridRows[0][c*2+1] = '#';
        if (mask & (1<<4)) gridRows[1][c*2+1] = '#';
        if (mask & (1<<5)) gridRows[2][c*2+1] = '#';
        if (mask & (1<<7)) gridRows[3][c*2+1] = '#';
      }
    const gridLines = gridRows.map(r => r.join(''));
  return {raw: rawCleaned, grid: gridLines};
    } catch (err) {
      return {raw: 'decode error: '+err, grid: []};
    }
  }

  function updateDebug() {
    const el = document.getElementById('debug');
    if (!helpVisible) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';
    const h = window.location.hash || '';
    const dec = decodeHashToGrid(h);
  let out = '';
  out += `<span class="unescaped">${dec.raw}</span>`;
  el.innerHTML = out;
  }

  let debugIntervalId = null;
  document.getElementById('show-help-btn').onclick = function() {
    helpVisible = true;
    updateDebug();
    this.style.display = 'none';
    if (!debugIntervalId) debugIntervalId = setInterval(updateDebug, 200);
  };

  let lastTime = performance.now();
  function rafLoop(now) {
    const elapsed = now - lastTime;
    if (elapsed >= FlappyConfig.TICK_INTERVAL) {
      step();
      lastTime = now;
    }
    if (!gameOver) intervalId = requestAnimationFrame(rafLoop);
  }
  intervalId = requestAnimationFrame(rafLoop);

})();
</script>
</body>
</html>
